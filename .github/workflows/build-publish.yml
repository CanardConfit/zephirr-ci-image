name: Build and publish CI image

on:
  push:
    tags:
      - '**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out image repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out application repository
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.APPLICATION_REPOSITORY }}
          ref: ${{ vars.APPLICATION_REF || 'main' }}
          path: application
          persist-credentials: false
          token: ${{ secrets.APPLICATION_REPOSITORY_TOKEN || github.token }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./application
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/canardconfit/zephirr-ci-image:${{ github.ref_name }}
            ghcr.io/canardconfit/zephirr-ci-image:latest
