exclude: ^(welcome/|path_finder/|semaphores/|car_system/)

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
    - id: conventional-pre-commit
      stages: [commit-msg]
      args: []
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  -   id: check-yaml
      files: \.(yaml|yml)$
      args: [--allow-multiple-documents]
  -   id: end-of-file-fixer
      files: \.(c|cc|cpp|cxx|h|hpp|hxx)$
  -   id: trailing-whitespace
      files: \.(c|cc|cpp|cxx|h|hpp|hxx)$
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: 'v22.1.5'
  hooks:
  - id: clang-format
    files: \.(c|cc|cpp|cxx|h|hpp|hxx)$  
- repo: local
  hooks:
  - id: copyright
    name: Check copyright
    entry: python deps/zpp_lib/scripts/check_copyright.py
    language: system
    pass_filenames: true
    files: \.(c|cc|cpp|cxx|h|hpp|hxx)$    
- repo: local
  hooks:
  - id: clang-tidy-blinky
    name: clang-tidy-blinky
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app blinky --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+gpio" --header-root "blinky" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(blinky)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-bme280
    name: clang-tidy-bme280
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app bme280 --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+sensor" --header-root "bme280" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(bme280)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-sanitize
    name: clang-tidy-sanitize
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app sanitize --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "shell+log+debug+san" --header-root "sanitize" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(sanitize)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-always-succeed
    name: clang-tidy-always-succeed
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app simple_tests/always_succeed --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+test" --header-root "simple_tests/always_succeed" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(simple_tests/always_succeed)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-ptr-test
    name: clang-tidy-ptr-test
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app simple_tests/ptr_test --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+test" --header-root "simple_tests/ptr_test" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(simple_tests/ptr_test)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-bike-computer
    name: clang-tidy-bike-computer
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app bike_computer --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "debug+gpio+display+sensor+phase_a" --header-root "bike_computer" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(bike_computer)/(?!tests/).*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-bike-computer-speedometer
    name: clang-tidy-bike-computer-speedometer
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app bike_computer/tests/speedometer --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+gpio+display+sensor+test+phase_a+phase_b+phase_c" --header-root "bike_computer" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(bike_computer/tests/speedometer)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-bike-computer-sensor-device
    name: clang-tidy-bike-computer-sensor-device
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app bike_computer/tests/sensor_device --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+gpio+display+sensor+test+phase_a" --header-root "bike_computer" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(bike_computer/tests/sensor_device)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-bike-computer-bike-system-part1
    name: clang-tidy-bike-computer-bike-system-part1
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app bike_computer/tests/bike_system_part1 --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+gpio+display+sensor+test+phase_a" --header-root "bike_computer" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(bike_computer/tests/bike_system_part1)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-bike-computer-bike-system-part2
    name: clang-tidy-bike-computer-bike-system-part2
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app bike_computer/tests/bike_system_part2 --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+gpio+display+sensor+test+phase_b" --header-root "bike_computer" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(bike_computer/tests/bike_system_part2)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-bike-computer-bike-system-part3
    name: clang-tidy-bike-computer-bike-system-part3
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app bike_computer/tests/bike_system_part3 --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+gpio+display+sensor+button_emul+test+phase_c" --header-root "bike_computer" --wd "."
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(bike_computer/tests/bike_system_part3)/.*\.(c|cc|cpp|cxx)$
  - id: clang-tidy-multi-tasking
    name: clang-tidy-multi-tasking
    entry: python deps/zpp_lib/scripts/run_clang_tidy.py --app multi_tasking --board nrf5340dk/nrf5340/cpuapp --shield adafruit_2_8_tft_touch_v2 --configs "log+debug+stats+gpio" --header-root "multi_tasking" --wd "." --app-config prj_multi_tasking.conf
    language: system
    pass_filenames: true
    require_serial: true
    files: ^(multi_tasking)/.*\.(c|cc|cpp|cxx)$
